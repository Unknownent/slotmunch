<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: rgb(76,47,181, 0.295);
      padding: 20px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes slideInCart {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideOutCart {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(24px); }
    }

    @keyframes qtyBump {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes totalPulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    @keyframes addPress {
      0%   { transform: scale(1); }
      40%  { transform: scale(0.88); }
      100% { transform: scale(1); }
    }

    @keyframes successPop {
      0%   { opacity: 0; transform: scale(0.9); }
      60%  { opacity: 1; transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      animation: fadeIn 0.4s ease both;
    }

    header h2 {
      color: #333;
    }

    header button {
      background: #eee;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .menu-section {
      flex: 2;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      animation: fadeUp 0.5s ease 0.08s both;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      animation: fadeUp 0.4s ease both;
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .menu-item-info h3 {
      font-size: 16px;
      color: #333;
    }

    .menu-item-info p {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    .menu-item-info .price {
      color: #ff6b35;
      font-weight: bold;
      margin-top: 4px;
    }

    .menu-item button {
      background-color: #ff6b35;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .menu-item button:hover {
      background-color: #e85a2a;
    }

    .menu-item button.added {
      animation: addPress 0.25s ease;
    }

    .cart-section {
      flex: 1;
      background: whitesmoke;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      min-width: 250px;
      height: fit-content;
      animation: fadeUp 0.5s ease 0.16s both;
    }

    .cart-section h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid #eee;
    }

    /* Only set on rows that are new or whose quantity changed, so other rows stay still */
    .cart-item.enter {
      animation: slideInCart 0.3s ease both;
    }

    .cart-item.bump {
      transform-origin: left center;
      animation: qtyBump 0.3s ease;
    }

    .cart-item.leaving {
      animation: slideOutCart 0.2s ease forwards;
    }

    .cart-item button {
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 4px;
      width: 22px;
      height: 22px;
      cursor: pointer;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px solid #eee;
      font-weight: bold;
      font-size: 16px;
    }

    #cartTotal {
      display: inline-block;
      transform-origin: right center;
    }

    #cartTotal.pulse {
      animation: totalPulse 0.3s ease;
    }

    .place-order-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      position: relative;
    }

    .place-order-btn:hover {
      background-color: #218838;
    }

    .place-order-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    /* Keeps the button green and shows a spinner while the order is being sent */
    .place-order-btn.loading,
    .place-order-btn.loading:disabled {
      background-color: #28a745;
      color: transparent;
      cursor: wait;
    }

    .place-order-btn.loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .empty-cart {
      color: #999;
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
      animation: fadeIn 0.4s ease both;
    }

    .success-msg {
      background: #d4edda;
      color: #155724;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .success-msg.show {
      display: block;
      animation: successPop 0.4s ease both;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h2 id="welcomeMsg">Welcome!</h2>
    <div>
      <button onclick="window.location.href='orders'">My Orders</button>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="menu-section">
      <h3 style="margin-bottom: 15px;">Today's Menu</h3>
      <div id="menuList">Loading menu...</div>
    </div>

    <div class="cart-section">
      <h3>Your Cart</h3>
      <div id="cartList">
        <div class="empty-cart">Your cart is empty</div>
      </div>
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">₦0</span>
      </div>
      <button class="place-order-btn" id="placeOrderBtn" onclick="placeOrder()" disabled>Place Order</button>
      <div class="success-msg" id="successMsg">Order placed successfully! ✅</div>
    </div>
  </div>

  <script>
    let staff = JSON.parse(localStorage.getItem('staff'));
    let cart = {};

    // What the cart showed last render, so only new or changed rows animate
    let renderedQty = {};
    let lastTotal = 0;
    let successTimer = null;

    if (!staff) {
      window.location.href = '/';
    } else {
      document.getElementById('welcomeMsg').textContent = `Welcome, ${staff.full_name}`;
    }

    function logout() {
      localStorage.removeItem('staff');
      window.location.href = '/';
    }

    async function loadMenu() {
      try {
        const response = await fetch('/api/menu');
        const items = await response.json();

        const menuList = document.getElementById('menuList');
        menuList.innerHTML = '';

        items.forEach((item, i) => {
          const div = document.createElement('div');
          div.className = 'menu-item';
          div.style.animationDelay = `${Math.min(i, 8) * 0.05}s`;
          div.innerHTML = `
            <div class="menu-item-info">
              <h3>${item.name}</h3>
              <p>${item.description || ''}</p>
              <div class="price">₦${item.price.toLocaleString()}</div>
            </div>
            <button onclick="addToCart(${item.item_id}, '${item.name}', ${item.price}, this)">Add</button>
          `;
          menuList.appendChild(div);
        });
      } catch (err) {
        document.getElementById('menuList').textContent = 'Could not load menu. Is the server running?';
      }
    }

    function addToCart(itemId, name, price, btn) {
      if (cart[itemId]) {
        cart[itemId].quantity += 1;
      } else {
        cart[itemId] = { name, price, quantity: 1 };
      }

      if (btn) {
        btn.classList.remove('added');
        void btn.offsetWidth;             // force reflow so the press animation can restart
        btn.classList.add('added');
      }

      renderCart();
    }

    function removeFromCart(itemId) {
      const row = document.querySelector(`.cart-item[data-id="${itemId}"]`);
      if (row) {
        row.classList.remove('enter', 'bump');
        row.classList.add('leaving');
        setTimeout(() => {
          delete cart[itemId];
          renderCart();
        }, 200);
      } else {
        delete cart[itemId];
        renderCart();
      }
    }

    function renderCart() {
      const cartList = document.getElementById('cartList');
      const placeOrderBtn = document.getElementById('placeOrderBtn');
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        cartList.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
        placeOrderBtn.disabled = true;
      } else {
        cartList.innerHTML = '';
        keys.forEach(itemId => {
          const item = cart[itemId];
          const div = document.createElement('div');
          div.className = 'cart-item';
          div.setAttribute('data-id', itemId);

          if (renderedQty[itemId] === undefined) {
            div.classList.add('enter');
          } else if (renderedQty[itemId] !== item.quantity) {
            div.classList.add('bump');
          }

          div.innerHTML = `
            <span>${item.name} x${item.quantity}</span>
            <div>
              <span>₦${(item.price * item.quantity).toLocaleString()}</span>
              <button onclick="removeFromCart(${itemId})">×</button>
            </div>
          `;
          cartList.appendChild(div);
        });
        placeOrderBtn.disabled = false;
      }

      renderedQty = {};
      keys.forEach(itemId => {
        renderedQty[itemId] = cart[itemId].quantity;
      });

      let total = 0;
      keys.forEach(itemId => {
        total += cart[itemId].price * cart[itemId].quantity;
      });

      const totalEl = document.getElementById('cartTotal');
      totalEl.textContent = `₦${total.toLocaleString()}`;

      if (total !== lastTotal) {
        totalEl.classList.remove('pulse');
        void totalEl.offsetWidth;
        totalEl.classList.add('pulse');
      }
      lastTotal = total;
    }

    function showSuccess() {
      const msg = document.getElementById('successMsg');
      msg.classList.remove('show');
      void msg.offsetWidth;
      msg.classList.add('show');

      clearTimeout(successTimer);
      successTimer = setTimeout(() => {
        msg.classList.remove('show');
      }, 3000);
    }

    async function placeOrder() {
      const placeOrderBtn = document.getElementById('placeOrderBtn');

      // Disabled while sending, which also blocks accidental double orders
      placeOrderBtn.disabled = true;
      placeOrderBtn.classList.add('loading');

      const items = Object.keys(cart).map(itemId => ({
        item_id: parseInt(itemId),
        quantity: cart[itemId].quantity,
        price: cart[itemId].price
      }));

      try {
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            staff_id: staff.staff_id,
            items: items
          })
        });

        const data = await response.json();

        placeOrderBtn.classList.remove('loading');

        if (response.ok) {
          showSuccess();
          cart = {};
          renderCart();
        } else {
          placeOrderBtn.disabled = false;
          alert(data.error || 'Failed to place order');
        }
      } catch (err) {
        placeOrderBtn.classList.remove('loading');
        placeOrderBtn.disabled = false;
        alert('Could not connect to server');
      }
    }

    document.getElementById('cartTotal').addEventListener('animationend', function() {
      this.classList.remove('pulse');
    });

    loadMenu();
  </script>

</body>
</html>
