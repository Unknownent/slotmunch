<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const staff = JSON.parse(localStorage.getItem('staff') || 'null');
      if (!staff) {
        window.location.href = '/';
      } else if (staff.role !== 'restaurant_staff' && staff.role !== 'admin') {
        window.location.href = 'menu';
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f4f4;
      padding: 20px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes valuePop {
      0%   { transform: scale(0.85); opacity: 0; }
      60%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes growX {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    @keyframes growY {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      animation: fadeIn 0.4s ease both;
    }

    header h2 { color: #333; }

    header button {
      background: #eee;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }
    .stat-card:nth-child(1) { animation-delay: 0.05s; }
    .stat-card:nth-child(2) { animation-delay: 0.12s; }
    .stat-card:nth-child(3) { animation-delay: 0.19s; }
    .stat-card:nth-child(4) { animation-delay: 0.26s; }

    .stat-card .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #ff6b35;
      margin-bottom: 6px;
    }

    /* Added after the data loads, so the number pops in instead of the "-" placeholder */
    .stat-card .stat-value.pop {
      animation: valuePop 0.4s ease both;
    }

    .stat-card .stat-label {
      font-size: 13px;
      color: #888;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
    }

    .chart-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      animation: fadeUp 0.5s ease both;
    }
    .chart-card:nth-child(1) { animation-delay: 0.3s; }
    .chart-card:nth-child(2) { animation-delay: 0.38s; }
    .chart-card:nth-child(3) { animation-delay: 0.46s; }

    .chart-card h3 {
      font-size: 15px;
      color: #333;
      margin-bottom: 15px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      animation: fadeUp 0.4s ease both;
    }

    .status-row:last-child { border-bottom: none; }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }

    .dot-pending { background: #ffc107; }
    .dot-preparing { background: #007bff; }
    .dot-ready { background: #28a745; }
    .dot-collected { background: #6c757d; }

    .bar-row {
      margin-bottom: 12px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }

    .bar-track {
      background: #f0f0f0;
      border-radius: 4px;
      height: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #ff6b35;
      border-radius: 4px;
      transform-origin: left;
      animation: growX 0.6s ease both;
    }

    .revenue-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 120px;
      padding-top: 10px;
    }

    .revenue-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 4px;
    }

    .revenue-bar {
      width: 100%;
      background: #ff6b35;
      border-radius: 4px 4px 0 0;
      min-height: 4px;
      transform-origin: bottom;
      animation: growY 0.6s ease both;
    }

    .revenue-day {
      font-size: 10px;
      color: #888;
      text-align: center;
      animation: fadeIn 0.5s ease both;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h2>Analytics</h2>
    <div>
      <button onclick="window.location.href='dashboard'">Back to Dashboard</button>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="ordersToday">-</div>
      <div class="stat-label">Orders Today</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="revenueToday">-</div>
      <div class="stat-label">Revenue Today</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalOrders">-</div>
      <div class="stat-label">Total Orders</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalRevenue">-</div>
      <div class="stat-label">Total Revenue</div>
    </div>
  </div>

  <div class="charts-grid">

    <div class="chart-card">
      <h3>Orders by Status</h3>
      <div id="statusBreakdown">Loading...</div>
    </div>

    <div class="chart-card">
      <h3>Top 5 Most Ordered Items</h3>
      <div id="topItems">Loading...</div>
    </div>

    <div class="chart-card">
      <h3>Revenue — Last 7 Days</h3>
      <div id="revenueChart">Loading...</div>
    </div>

  </div>

  <script>
    let staff = JSON.parse(localStorage.getItem('staff'));

    if (!staff) {
      window.location.href = '/';
    } else if (staff.role !== 'restaurant_staff' && staff.role !== 'admin') {
      window.location.href = 'menu';
    }

    function logout() {
      localStorage.removeItem('staff');
      window.location.href = '/';
    }

    const STATUS_COLORS = {
      pending: 'dot-pending',
      preparing: 'dot-preparing',
      ready: 'dot-ready',
      collected: 'dot-collected'
    };

    function setStat(id, text) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.classList.add('pop');
    }

    async function loadAnalytics() {
      try {
        const response = await fetch('/api/analytics');
        const data = await response.json();

        setStat('ordersToday', data.orders_today);
        setStat('revenueToday', `₦${data.revenue_today.toLocaleString()}`);
        setStat('totalOrders', data.total_orders);
        setStat('totalRevenue', `₦${data.total_revenue.toLocaleString()}`);

        const statusEl = document.getElementById('statusBreakdown');
        if (Object.keys(data.status_counts).length === 0) {
          statusEl.innerHTML = '<div class="empty-state">No orders yet</div>';
        } else {
          statusEl.innerHTML = '';
          const statuses = ['pending', 'preparing', 'ready', 'collected'];
          statuses.forEach((status, i) => {
            const count = data.status_counts[status] || 0;
            const div = document.createElement('div');
            div.className = 'status-row';
            div.style.animationDelay = `${i * 0.08}s`;
            div.innerHTML = `
              <span>
                <span class="status-dot ${STATUS_COLORS[status]}"></span>
                ${status.charAt(0).toUpperCase() + status.slice(1)}
              </span>
              <strong>${count}</strong>
            `;
            statusEl.appendChild(div);
          });
        }

        const topItemsEl = document.getElementById('topItems');
        if (data.top_items.length === 0) {
          topItemsEl.innerHTML = '<div class="empty-state">No orders yet</div>';
        } else {
          topItemsEl.innerHTML = '';
          const maxQty = data.top_items[0].quantity;
          data.top_items.forEach((item, i) => {
            const pct = Math.round((item.quantity / maxQty) * 100);
            const div = document.createElement('div');
            div.className = 'bar-row';
            div.innerHTML = `
              <div class="bar-label">
                <span>${item.name}</span>
                <span>${item.quantity} orders</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill" style="width: ${pct}%; animation-delay: ${i * 0.1}s"></div>
              </div>
            `;
            topItemsEl.appendChild(div);
          });
        }

        const revenueEl = document.getElementById('revenueChart');
        if (data.revenue_by_day.length === 0) {
          revenueEl.innerHTML = '<div class="empty-state">No revenue data yet</div>';
        } else {
          const maxRevenue = Math.max(...data.revenue_by_day.map(d => d.revenue));
          const barsHTML = data.revenue_by_day.map((day, i) => {
            const heightPct = maxRevenue > 0 ? Math.round((day.revenue / maxRevenue) * 100) : 0;
            const date = new Date(day.day);
            const label = date.toLocaleDateString('en-NG', { month: 'short', day: 'numeric' });
            return `
              <div class="revenue-bar-wrap">
                <div class="revenue-bar" style="height: ${heightPct}%; animation-delay: ${i * 0.08}s"></div>
                <div class="revenue-day" style="animation-delay: ${i * 0.08}s">${label}</div>
              </div>
            `;
          }).join('');

          revenueEl.innerHTML = `<div class="revenue-row">${barsHTML}</div>`;
        }

      } catch (err) {
        document.querySelector('.stats-grid').innerHTML = '<p style="color:red; padding:10px;">Could not load analytics. Is the server running?</p>';
      }
    }

    loadAnalytics();
  </script>

</body>
</html>
