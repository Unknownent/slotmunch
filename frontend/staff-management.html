<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const staff = JSON.parse(localStorage.getItem('staff') || 'null');
      if (!staff) {
        window.location.href = '/';
      } else if (staff.role !== 'admin') {
        window.location.href = 'menu';
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Staff</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: lightgray;
      padding: 20px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes rowPulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.015); }
      100% { transform: scale(1); }
    }

    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(24px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FF6B35;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      animation: fadeIn 0.4s ease both;
    }

    header h2 { color: #333; }

    header button {
      background: #eee;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .form-section {
      flex: 1;
      min-width: 280px;
      background: lightslategray;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      height: fit-content;
      animation: fadeUp 0.5s ease 0.08s both;
    }

    .form-section h3 {
      margin-bottom: 15px;
      color: #333;
      transform-origin: left;
    }

    .form-section h3.pop {
      animation: pop 0.35s ease;
    }

    .form-section input,
    .form-section select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid gainsboro;
      border-radius: 6px;
      font-size: 14px;
    }

    .form-section button {
      position: relative;
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .form-section button:hover { background-color: #218838; }

    /* Keeps the save button green and shows a spinner while the request runs */
    .form-section button.loading,
    .form-section button.loading:hover {
      background-color: #28a745;
      color: transparent;
      cursor: wait;
    }

    .form-section button.loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      margin: -8px 0 0 -8px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .list-section {
      flex: 2;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      animation: fadeUp 0.5s ease 0.16s both;
    }

    .list-section h3 { margin-bottom: 15px; color: #333; }

    .search-bar {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .staff-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      gap: 10px;
      flex-wrap: wrap;
    }

    .staff-row:last-child { border-bottom: none; }

    /* Only set on rows that are new or changed, so typing in the search bar doesn't replay it */
    .staff-row.enter {
      animation: fadeUp 0.4s ease both;
    }

    .staff-row.changed {
      animation: rowPulse 0.45s ease;
    }

    .staff-row.leaving {
      animation: slideOut 0.3s ease forwards;
    }

    .staff-info h4 { font-size: 15px; color: #333; }
    .staff-info p { font-size: 13px; color: #888; margin-top: 2px; }

    .role-badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-top: 4px;
      display: inline-block;
    }

    .role-badge.worker { background: #cce5ff; color: #004085; }
    .role-badge.restaurant_staff { background: #fff3cd; color: #856404; }
    .role-badge.admin { background: #d4edda; color: #155724; }

    .staff-actions { display: flex; gap: 8px; }

    .staff-actions button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-edit { background: #007bff; color: white; }
    .btn-delete { background: #dc3545; color: white; }

    .success-msg, .error-msg {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
      display: none;
    }

    .success-msg { background: #d4edda; color: #155724; }
    .error-msg { background: #f8d7da; color: #721c24; }

    .success-msg.show,
    .error-msg.show {
      display: block;
      animation: msgIn 0.25s ease both;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 40px;
      animation: fadeIn 0.4s ease both;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h2>Manage Staff</h2>
    <div>
      <button onclick="window.location.href='dashboard'">Back to Dashboard</button>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="form-section">
      <h3 id="formTitle">Add New Staff</h3>
      <div class="success-msg" id="successMsg"></div>
      <div class="error-msg" id="errorMsg"></div>

      <input type="hidden" id="editStaffId">
      <input type="text" id="staffId" placeholder="Staff ID (e.g. STF004)">
      <input type="text" id="fullName" placeholder="Full Name">
      <input type="text" id="department" placeholder="Department">
      <select id="role">
        <option value="worker">Worker</option>
        <option value="restaurant_staff">Restaurant Staff</option>
        <option value="admin">Admin</option>
      </select>
      <input type="email" id="email" placeholder="Email">
      <input type="text" id="floorNumber" placeholder="Floor Number (e.g. 1st Floor, Ground Floor)">
      <input type="password" id="password" placeholder="Password (leave blank to keep unchanged)">
      <button onclick="saveStaff()" id="saveBtn">Add Staff</button>
      <button onclick="resetForm()" style="background:#6c757d; display:none;" id="cancelBtn">Cancel Edit</button>
    </div>

    <div class="list-section">
      <h3>All Staff Members</h3>
      <input type="text" class="search-bar" id="searchBar" placeholder="Search by name, ID or department..." oninput="filterStaff()">
      <div id="staffList">Loading...</div>
    </div>
  </div>

  <script>
    let staff = JSON.parse(localStorage.getItem('staff'));
    let allStaff = [];

    // Remembers what has already been shown so only new or changed rows animate
    const seenStaff = new Set();
    const lastState = {};
    let messageTimer = null;

    if (!staff) {
      window.location.href = '/';
    } else if (staff.role !== 'admin') {
      window.location.href = 'menu';
    }

    function logout() {
      localStorage.removeItem('staff');
      window.location.href = '/';
    }

    function showMessage(type, text) {
      const successEl = document.getElementById('successMsg');
      const errorEl = document.getElementById('errorMsg');
      successEl.classList.remove('show');
      errorEl.classList.remove('show');

      const target = type === 'success' ? successEl : errorEl;
      target.textContent = text;
      void target.offsetWidth;            // force reflow so the animation can restart
      target.classList.add('show');

      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => {
        successEl.classList.remove('show');
        errorEl.classList.remove('show');
      }, 3000);
    }

    function popFormTitle() {
      const title = document.getElementById('formTitle');
      title.classList.remove('pop');
      void title.offsetWidth;
      title.classList.add('pop');
    }

    document.getElementById('formTitle').addEventListener('animationend', function() {
      this.classList.remove('pop');
    });

    async function loadStaff() {
      try {
        const response = await fetch('/api/staff');
        allStaff = await response.json();
        filterStaff();
      } catch (err) {
        document.getElementById('staffList').innerHTML = '<div class="empty-state">Could not load staff. Is the server running?</div>';
      }
    }

    function filterStaff() {
      const query = document.getElementById('searchBar').value.toLowerCase();
      const filtered = allStaff.filter(s =>
        s.full_name.toLowerCase().includes(query) ||
        s.staff_id.toLowerCase().includes(query) ||
        (s.department || '').toLowerCase().includes(query)
      );
      renderStaff(filtered);
    }

    function renderStaff(staffList) {
      const container = document.getElementById('staffList');

      if (staffList.length === 0) {
        const msg = 'No staff found';
        const current = container.firstElementChild;
        // Already showing this message, so skip it and don't replay the fade on every keystroke
        if (current && current.classList.contains('empty-state') && current.textContent === msg) return;
        container.innerHTML = `<div class="empty-state">${msg}</div>`;
        return;
      }

      container.innerHTML = '';
      let newCount = 0;

      staffList.forEach(member => {
        const div = document.createElement('div');
        div.className = 'staff-row';
        div.setAttribute('data-id', member.staff_id);

        const state = [member.full_name, member.department, member.role, member.email, member.floor_number].join('|');
        if (!seenStaff.has(member.staff_id)) {
          div.classList.add('enter');
          div.style.animationDelay = `${Math.min(newCount, 8) * 0.05}s`;
          newCount++;
        } else if (lastState[member.staff_id] !== state) {
          div.classList.add('changed');
        }
        seenStaff.add(member.staff_id);
        lastState[member.staff_id] = state;

        const roleLabel = member.role === 'restaurant_staff' ? 'Restaurant Staff' : (member.role === 'admin' ? 'Admin' : 'Worker');
        div.innerHTML = `
          <div class="staff-info">
            <h4>${member.full_name} <span style="font-size:12px; color:#aaa;">(${member.staff_id})</span></h4>
            <p>${member.department || 'No department'} • Floor: ${member.floor_number || 'N/A'} • ${member.email || 'No email'}</p>
            <span class="role-badge ${member.role}">${roleLabel}</span>
          </div>
          <div class="staff-actions">
            <button class="btn-edit" onclick="editStaff('${member.staff_id}', '${member.full_name.replace(/'/g, "\\'")}', '${(member.department || '').replace(/'/g, "\\'")}', '${member.role}', '${(member.email || '').replace(/'/g, "\\'")}', '${(member.floor_number || '').replace(/'/g, "\\'")}')">Edit</button>
            <button class="btn-delete" onclick="deleteStaff('${member.staff_id}', '${member.full_name.replace(/'/g, "\\'")}')">Delete</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function editStaff(id, fullName, department, role, email, floorNumber) {
      document.getElementById('formTitle').textContent = 'Edit Staff Member';
      document.getElementById('editStaffId').value = id;
      document.getElementById('staffId').value = id;
      document.getElementById('staffId').disabled = true;
      document.getElementById('fullName').value = fullName;
      document.getElementById('department').value = department;
      document.getElementById('role').value = role;
      document.getElementById('email').value = email;
      document.getElementById('floorNumber').value = floorNumber || '';
      document.getElementById('password').value = '';
      document.getElementById('saveBtn').textContent = 'Update Staff';
      document.getElementById('cancelBtn').style.display = 'block';
      popFormTitle();
      window.scrollTo(0, 0);
    }

    function resetForm() {
      document.getElementById('formTitle').textContent = 'Add New Staff';
      document.getElementById('editStaffId').value = '';
      document.getElementById('staffId').value = '';
      document.getElementById('staffId').disabled = false;
      document.getElementById('fullName').value = '';
      document.getElementById('department').value = '';
      document.getElementById('role').value = 'worker';
      document.getElementById('email').value = '';
      document.getElementById('floorNumber').value = '';
      document.getElementById('password').value = '';
      document.getElementById('saveBtn').textContent = 'Add Staff';
      document.getElementById('cancelBtn').style.display = 'none';
    }

    async function saveStaff() {
      const saveBtn = document.getElementById('saveBtn');
      const editId = document.getElementById('editStaffId').value;
      const staffId = document.getElementById('staffId').value.trim();
      const fullName = document.getElementById('fullName').value.trim();
      const department = document.getElementById('department').value.trim();
      const role = document.getElementById('role').value;
      const email = document.getElementById('email').value.trim();
      const floorNumber = document.getElementById('floorNumber').value.trim();
      const password = document.getElementById('password').value;

      if (!staffId || !fullName || !role) {
        showMessage('error', 'Staff ID, full name and role are required');
        return;
      }

      if (!editId && !password) {
        showMessage('error', 'Password is required for new staff');
        return;
      }

      // Disabled while sending, which also blocks double taps on a slow connection
      saveBtn.disabled = true;
      saveBtn.classList.add('loading');

      try {
        let response;
        const headers = {
          'Content-Type': 'application/json',
          'X-Staff-Id': staff.staff_id
        };

        if (editId) {
          const body = { full_name: fullName, department, role, email, floor_number: floorNumber };
          if (password) body.password = password;
          response = await fetch(`/api/staff/${editId}`, {
            method: 'PUT',
            headers,
            body: JSON.stringify(body)
          });
        } else {
          response = await fetch('/api/staff', {
            method: 'POST',
            headers,
            body: JSON.stringify({ staff_id: staffId, full_name: fullName, department, role, email, floor_number: floorNumber, password })
          });
        }

        if (response.ok) {
          showMessage('success', editId ? 'Staff updated!' : 'Staff added!');
          resetForm();
          loadStaff();
        } else {
          const data = await response.json();
          showMessage('error', data.error || 'Failed to save staff member');
        }
      } catch (err) {
        showMessage('error', 'Could not connect to server');
      } finally {
        saveBtn.disabled = false;
        saveBtn.classList.remove('loading');
      }
    }

    async function deleteStaff(staffId, name) {
      if (!confirm(`Are you sure you want to delete ${name}? This cannot be undone.`)) return;

      try {
        const response = await fetch(`/api/staff/${staffId}`, {
          method: 'DELETE',
          headers: { 'X-Staff-Id': staff.staff_id }
        });

        if (response.ok) {
          showMessage('success', 'Staff member deleted');
          seenStaff.delete(staffId);
          delete lastState[staffId];

          const row = Array.from(document.querySelectorAll('.staff-row'))
            .find(el => el.getAttribute('data-id') === staffId);
          if (row) {
            row.classList.remove('enter', 'changed');
            row.classList.add('leaving');
            setTimeout(loadStaff, 300);
          } else {
            loadStaff();
          }
        } else {
          showMessage('error', 'Failed to delete staff member');
        }
      } catch (err) {
        showMessage('error', 'Could not connect to server');
      }
    }

    loadStaff();
  </script>

</body>
</html>
